name: Scrape sessions

on:
  # Every 15 minutes, 05:00–22:45 UTC: covers every session start in both BST
  # and GMT. Ingest only writes rows that changed, which keeps D1 under its
  # free 100k writes a day. Public repo, so Actions minutes are free.
  # The cron Worker (cron/) dispatches the real runs and sends archive=true on
  # the :45 run of every second hour, so data is committed to git ~9 times a
  # day. This schedule is only a backup for ingest and never commits: when it
  # also committed, it raced the Worker's archive run and the rebase conflicted.
  schedule:
    - cron: '0,15,30,45 5-22 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these venues (comma-separated substrings, e.g. "pulse,arc"). Blank = all.'
        required: false
        default: ''
      days_ahead:
        description: 'Days ahead to scrape'
        required: false
        default: '7'
      archive:
        description: 'Commit data to git (the cron Worker sends false except in the archive slot)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned: ubuntu-latest is moving to 26.04, which Playwright 1.48
    # predates.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install chromium

      # System libraries come from apt, and a slow mirror can take 10+ minutes
      # and eat the job timeout. The runner image ships Google Chrome, so the
      # libraries Chromium needs are almost always there already: give apt a
      # few minutes and carry on without it.
      - name: Install Chromium system deps
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Scrape
        env:
          ONLY: ${{ inputs.only }}
          DAYS_AHEAD: ${{ inputs.days_ahead || '7' }}
        run: npm run scrape

      - name: Push to web backend
        if: always() && hashFiles('out/run.json') != ''
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: node src/push.mjs

      - name: Commit data
        if: always() && github.event_name == 'workflow_dispatch' && inputs.archive != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if ! git pull --rebase; then
              # Another run committed a snapshot of the same files meanwhile.
              # It's equally current, so keep it and skip ours.
              git rebase --abort
              echo "Snapshot conflicts with a newer one on main; skipping"
              exit 0
            fi
            git push && exit 0
            sleep 5
          done
          exit 1
