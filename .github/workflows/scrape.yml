name: Scrape sessions

on:
  # Every 15 minutes, 05:00–22:45 UTC: covers every session start in both BST
  # and GMT. Ingest only writes rows that changed, which keeps D1 under its
  # free 100k writes a day. Public repo, so Actions minutes are free.
  # Data is committed to git only on the :45 run of every second hour (the
  # ARCHIVE schedule), to keep the repo from growing ~70 commits a day.
  schedule:
    - cron: '0,15,30 5-22 * * *'
    - cron: '45 6-22/2 * * *'
    - cron: '45 5-21/2 * * *'   # ARCHIVE
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these venues (comma-separated substrings, e.g. "pulse,arc"). Blank = all.'
        required: false
        default: ''
      days_ahead:
        description: 'Days ahead to scrape'
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Scrape
        env:
          ONLY: ${{ inputs.only }}
          DAYS_AHEAD: ${{ inputs.days_ahead || '7' }}
        run: npm run scrape

      - name: Push to web backend
        if: always() && hashFiles('out/run.json') != ''
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: node src/push.mjs

      - name: Commit data
        if: always() && (github.event_name != 'schedule' || github.event.schedule == '45 5-21/2 * * *')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
